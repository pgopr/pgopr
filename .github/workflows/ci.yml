name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  lint:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo clippy
        run: cargo clippy -- -D warnings

  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo test
        run: cargo test

  manual:
    name: Build Manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-plain-generic \
            texlive-latex-extra \
            lmodern

      - name: Install Eisvogel template
        run: |
          EISVOGEL_VERSION=3.4.0
          mkdir -p ~/.local/share/pandoc/templates
          curl -fsSLo /tmp/eisvogel.tar.gz \
            "https://github.com/Wandmalfarbe/pandoc-latex-template/releases/download/v${EISVOGEL_VERSION}/Eisvogel-${EISVOGEL_VERSION}.tar.gz"
          tar -xzf /tmp/eisvogel.tar.gz -C ~/.local/share/pandoc/templates --strip-components=1

      - name: Build manual
        run: make doc

      - name: Upload manual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual
          path: |
            target/doc/pgopr-en.pdf
            target/doc/pgopr-en.html

  full-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run integration tests
        run: |
          set -o pipefail
          mkdir -p /tmp/pgopr-test/log
          chmod u+x ./test/check.sh
          ./test/check.sh ci 2>&1 | tee /tmp/pgopr-test/log/test.log

      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-logs
          path: /tmp/pgopr-test/log/test.log
          if-no-files-found: ignore
