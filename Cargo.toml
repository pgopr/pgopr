[package]
name = "pgopr"
version = "0.2.0"
authors = ["Jesper Pedersen <jesperpedersen.db@gmail.com>", "Cristian Guarino <cristian.guarino.j@gmail.com>", "Nick Boyadjian <nboyadjian95@gmail.com>"]
edition = "2024"
license = "Eclipse Public License 2.0"
description = "PostgreSQL operator for Kubernetes"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
kube = { version = "3.0", default-features = true, features = ["client", "derive", "runtime"] }
k8s-openapi = { version = "0.27", default-features = true, features = ["v1_35", "schemars"] }
clap = { version = "4.5", default-features = false, features = ["std", "cargo", "help"] }
clap_complete = { version = "4.5" }
directories = { version = "6.0" }
figment = { version = "0.10", features = ["env", "toml"] }
futures = { version = "0.3" }
log = { version = "0.4", features = ["max_level_trace", "release_max_level_trace"] }
log4rs = { version = "1.4" }
schemars = { version = "1.2" }
serde = { version = "1.0" }
serde_derive = { version = "1.0" }
serde_json = { version = "1.0" }
serde_yaml = { version = "0.9" }
thiserror = { version = "2.0" }
toml = { version = "0.9" }
anyhow = "1.0"
markdown = "1.0.0"
printpdf = { version = "0.12", default-features = false, features = ["text_layout", "png"] }
ttf-parser = "0.25"

[dev-dependencies]
pdf-extract = "0.12"
tempfile = "3"

[package.metadata.deb]
maintainer = "Jesper Pedersen <jesperpedersen.db@gmail.com>"
copyright = "2026 pgopr developers"
license-file = ["LICENSE", "0"]
depends = "libc6"
section = "database"
priority = "optional"
assets = [
    ["target/release/pgopr", "usr/bin/pgopr", "755"],
    ["README.md", "usr/share/doc/pgopr/README.md", "644"],
    ["LICENSE", "usr/share/doc/pgopr/LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pgopr", dest = "/usr/bin/pgopr", mode = "0755" },
    { source = "README.md", dest = "/usr/share/doc/pgopr/README.md", mode = "0644" },
    { source = "LICENSE", dest = "/usr/share/doc/pgopr/LICENSE", mode = "0644" }
]
auto-req = "no"

[profile.release]
strip = true

